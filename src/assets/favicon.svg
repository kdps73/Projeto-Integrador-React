<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b4b" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100" height="100" rx="22" fill="#111111" />
  
  <path d="M 75 25 A 35 35 0 1 0 75 75" 
        fill="none" 
        stroke="url(#redGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        filter="url(#glow)" />
        
  <!-- Brilho vermelho por trás da estrela -->
  <polygon points="50,36 53.5,45.5 63.5,45.5 55.5,51.5 58.5,61 50,55 41.5,61 44.5,51.5 36.5,45.5 46.5,45.5" 
           fill="#dc2626" 
           filter="url(#glow)" />
           
  <!-- Estrela de Classificação no centro do C (Branca) -->
  <polygon points="50,36 53.5,45.5 63.5,45.5 55.5,51.5 58.5,61 50,55 41.5,61 44.5,51.5 36.5,45.5 46.5,45.5" 
           fill="#ffffff" />
</svg>
