<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo escuro com bordas arredondadas -->
  <rect width="100" height="100" rx="22" fill="#111111" />
  
  <!-- Letra C estilizada como fita de cinema (Neon Vermelho) -->
  <path d="M 75 25 A 35 35 0 1 0 75 75" 
        fill="none" 
        stroke="#dc2626" 
        stroke-width="20" 
        stroke-linecap="round" 
        filter="url(#glow)" />
        
  <!-- Furos da Fita de Cinema (Espaço Negativo com círculos pretos vazados) -->
  <path d="M 75 25 A 35 35 0 1 0 75 75" 
        fill="none" 
        stroke="#111111" 
        stroke-width="8" 
        stroke-dasharray="0 16" 
        stroke-linecap="round" />
        
  <!-- Brilho vermelho por trás da estrela -->
  <polygon points="50,36 53.5,45.5 63.5,45.5 55.5,51.5 58.5,61 50,55 41.5,61 44.5,51.5 36.5,45.5 46.5,45.5" 
           fill="#dc2626" 
           filter="url(#glow)" />
           
  <!-- Estrela de Classificação no centro do C (Branca) -->
  <polygon points="50,36 53.5,45.5 63.5,45.5 55.5,51.5 58.5,61 50,55 41.5,61 44.5,51.5 36.5,45.5 46.5,45.5" 
           fill="#ffffff" />
</svg>
