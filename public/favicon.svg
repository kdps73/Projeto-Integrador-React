<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Fundo Preto (com cantos levemente arredondados) -->
  <rect width="120" height="120" rx="24" fill="#050505"/>
  
  <!-- Grupo para centralizar perfeitamente as duas letras no canvas -->
  <g transform="translate(0.5, 0)">
    
    <!-- Letra C - Vermelho Escuro -->
    <path d="M 76 30 
             A 40 40 0 1 0 76 90 
             L 63 77 
             A 22 22 0 1 1 63 43 
             Z" 
          fill="#8A1327"/>
    
    <!-- Letra i (Reta e Alinhada) - Vermelho Escuro -->
    <!-- Pingo do i alinhado com o topo curvo do C -->
    <circle cx="92" cy="29" r="9" fill="#8A1327"/>
    
    <!-- Corpo do i com espessura simétrica à do C e base reta -->
    <rect x="83" y="47" width="18" height="49" fill="#8A1327"/>
    
  </g>
</svg>
